version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-api
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      API_URL: http://localhost:4000/api/v1
      JWT_SECRET: dev-jwt-secret-change-me-123456
      DATABASE_URL: mongodb://mongo:27017/erp-universal-dev
      MONGODB_DB_NAME: erp-universal
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: erp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
