name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set supported npm version
        run: npm install --global npm@10.9.8
      - name: Install locked project dependencies
        run: npm ci
      - name: Typecheck all workspaces
        run: npm run typecheck
      - name: Verify security dependency compatibility
        run: npm run test:dependency-security
      - name: Audit backend and web runtime dependencies
        run: |
          npm audit --workspace backend --omit=dev --audit-level=moderate
          npm audit --workspace apps/web --omit=dev --audit-level=moderate
      - name: Build backend and web
        run: npm run build
      - name: Run backend and mobile tests
        run: npm test
      - name: Run web tests
        working-directory: apps/web
        run: node --import tsx --test tests/*.test.ts
      - name: Verify backup encryption
        run: npm --workspace backend run test:backup
      - name: Verify MongoDB transactions and tenant isolation locally
        run: npm --workspace backend run test:stock:local
